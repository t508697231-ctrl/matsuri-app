    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            --gray: #e2e8f0;
            --orange: #ea580c;
            --indigo: #4f46e5;
        }

        * {
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 10px;
            margin: 0;
            font-size: 22px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .card {
            background: white;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 36px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        .card-blue {
            border-color: #93c5fd;
            background: #eff6ff;
        }

        .card-green {
            border-color: #86efac;
            background: #f0fdf4;
        }

        .card-orange {
            border-color: #fdba74;
            background: #fff7ed;
        }

        .card-indigo {
            border-color: #a5b4fc;
            background: #eef2ff;
        }

        input,
        select,
        textarea {
            font-size: 26px;
            font-weight: bold;
            padding: 16px;
            border: 4px solid #cbd5e1;
            border-radius: 12px;
            width: 100%;
            margin-top: 8px;
            background: #fff;
        }

        input[type="number"] {
            text-align: right;
            font-size: 34px;
            font-weight: 900;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            font-size: 26px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: 0.1s;
        }

        button:active {
            transform: translateY(4px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-bottom: 6px solid var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
            border-bottom: 6px solid #14532d;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border-bottom: 6px solid #7f1d1d;
        }

        .btn-gray {
            background: #475569;
            color: white;
            border-bottom: 6px solid #1e293b;
        }

        .btn-outline {
            background: white;
            border: 4px solid var(--primary);
            color: var(--primary);
        }

        .btn-share {
            background: #059669;
            color: white;
            border-bottom: 8px solid #064e3b;
            font-size: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-4 {
            gap: 16px;
        }

        .gap-2 {
            gap: 8px;
        }

        .mt-4 {
            margin-top: 16px;
        }

        .mt-2 {
            margin-top: 8px;
        }

        .mb-6 {
            margin-bottom: 24px;
        }

        .mb-2 {
            margin-bottom: 8px;
        }

        .w-full {
            width: 100%;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-2xl {
            font-size: 24px;
        }

        .text-3xl {
            font-size: 32px;
        }

        .text-4xl {
            font-size: 44px;
        }

        .text-5xl {
            font-size: 56px;
        }

        .text-6xl {
            font-size: 68px;
            line-height: 1.1;
        }

        .mb-8 {
            margin-bottom: 40px;
        }

        .mt-8 {
            margin-top: 40px;
        }

        .font-black {
            font-weight: 900;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Tabs */
        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            align-items: center;
        }

        .tab {
            flex: none;
            padding: 24px 36px;
            font-size: 32px;
            font-weight: 900;
            background: white;
            border: 6px solid #cbd5e1;
            border-radius: 16px;
            color: #475569;
        }

        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            transform: translateY(-4px);
        }

        .tab-add {
            background: #ffedd5;
            color: #c2410c;
            border-color: #f97316;
        }

        /* Graph */
        .graph-container {
            display: flex;
            height: 400px;
            align-items: flex-end;
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            border: 6px solid #cbd5e1;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            overflow-x: auto;
        }

        .bar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 100%;
            flex: 1;
            padding: 0 10px;
            min-width: 90px;
        }

        .bar {
            background: var(--primary);
            width: 100%;
            max-width: 120px;
            border-radius: 12px 12px 0 0;
            border: 6px solid var(--primary-dark);
            border-bottom: none;
        }

        .bar-val {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 12px;
            word-break: break-all;
            text-align: center;
        }

        .bar-lbl {
            margin-top: 16px;
            font-size: 28px;
            font-weight: 900;
            background: white;
            padding: 4px 12px;
            border: 4px solid #cbd5e1;
            border-radius: 8px;
            white-space: nowrap;
        }

        .balance-bar {
            display: flex;
            height: 120px;
            border-radius: 30px;
            overflow: hidden;
            border: 8px solid #94a3b8;
            width: 100%;
            color: white;
            font-weight: 900;
            font-size: 36px;
            box-shadow: inset 0 6px 15px rgba(0, 0, 0, 0.3);
            background: #e2e8f0;
            margin-bottom: 16px;
        }

        .balance-red {
            background: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0 10px;
            min-width: max-content;
        }

        .balance-green {
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0 10px;
            min-width: max-content;
        }

        .stepper {
            display: flex;
            border: 4px solid #94a3b8;
            border-radius: 12px;
            overflow: hidden;
            height: 80px;
            background: white;
        }

        .stepper button {
            border: none;
            background: #e2e8f0;
            width: 80px;
            font-size: 40px;
            color: black;
            border-radius: 0;
            padding: 0;
        }

        .stepper .val {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 900;
        }

        .hide {
            display: none !important;
        }

        .print-single-show,
        .print-all-show {
            display: none !important;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .no-print,
            .screen-only,
            .screen-dashboard {
                display: none !important;
            }

            body.print-single-mode .print-single-show {
                display: block !important;
            }

            body.print-single-mode .print-all-show {
                display: none !important;
            }

            body.print-all-mode .print-single-show {
                display: none !important;
            }

            body.print-all-mode .print-all-show {
                display: block !important;
            }

            body:not(.print-all-mode):not(.print-single-mode) .print-single-show {
                display: block !important;
            }

            body:not(.print-all-mode):not(.print-single-mode) .print-all-show {
                display: none !important;
            }

            .card {
                border: 3px solid #000 !important;
                box-shadow: none !important;
                break-inside: avoid;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th, td {
                border: 1.5px solid #000 !important;
                padding: 6px 10px !important;
            }

            .page-break {
                page-break-after: always;
                break-after: page;
            }
        }

        @media (max-width: 768px) {
            .modal-header {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .modal-header button {
                width: 100% !important;
                margin-top: 8px;
            }
            .modal-card {
                padding: 16px !important;
                border-radius: 16px !important;
            }
        }

        /* スマホ専用レスポンシブデザイン */
        @media (max-width: 768px) {

            html,
            body {
                overflow-x: hidden;
                width: 100vw;
            }

            .mobile-stack {
                flex-direction: column !important;
                gap: 16px !important;
            }

            .mobile-stack>div {
                width: 100% !important;
                margin: 0 !important;
            }

            /* スタッフ一覧ボタン配置 */
            .staff-row {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 12px;
            }

            .staff-row input {
                width: 100% !important;
                margin-bottom: 8px;
            }

            .staff-buttons {
                width: 100%;
                justify-content: space-between;
                display: flex;
                gap: 8px;
            }

            .staff-buttons button {
                flex: 1;
                padding: 16px 8px;
                font-size: 24px;
                min-width: 0;
                white-space: nowrap;
            }

            /* ダッシュボードのカード文字サイズ自動調整 */
            .text-6xl {
                font-size: 11vw !important;
            }

            .text-5xl {
                font-size: 9vw !important;
            }

            .text-4xl {
                font-size: 7vw !important;
            }

            .text-3xl {
                font-size: 6vw !important;
            }

            /* その他微調整 */
            .date-weather-mobile {
                flex-direction: column !important;
                gap: 16px !important;
            }

            .date-weather-mobile > div {
                width: 100% !important;
                flex: none !important;
            }

            .graph-container {
                height: 300px;
                padding: 10px;
            }

            .bar-val {
                font-size: 20px;
            }

            .bar-lbl {
                font-size: 16px;
                padding: 4px;
            }
        }
    
        /* 履歴モーダル・過去イベント切替スタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-card {
            background: #ffffff;
            border: 6px solid #1e3a8a;
            border-radius: 24px;
            width: 100%;
            max-width: 920px;
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            word-break: break-word;
        }

        .event-history-item {
            border: 4px solid #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
        }

        .event-history-item.active-event {
            border-color: #2563eb;
            background: #eff6ff;
            border-width: 5px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .past-banner {
            background: #fef3c7;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 24px;
        }

    </style>
</head>

<body>
    <div class="container" id="app"></div>

    <script>
        // --- Constants & Defaults ---
        const DEFAULT_MEAL_COST = 920;
        const getMealCost = () => (state.mealCost !== undefined && state.mealCost !== null && !isNaN(state.mealCost)) ? Number(state.mealCost) : DEFAULT_MEAL_COST;
        const STORAGE_KEY = "shushi-app-data-offline";
        const STORAGE_KEY_ARCHIVE = "matsuri-events-archive-v1";
        const STORAGE_KEY_ACTIVE_ID = "matsuri-active-event-id";
        const STORAGE_KEY_GAS_URL = "matsuri-gas-endpoint-url";
        const DEFAULT_GAS_URL = "";
        let gasUrl = localStorage.getItem(STORAGE_KEY_GAS_URL) || "";

        let eventsArchive = [];
        let isHistoryModalOpen = false;
        let isGuideModalOpen = false;

        window.openGuideModal = () => { isGuideModalOpen = true; render(); };
        window.closeGuideModal = () => { isGuideModalOpen = false; render(); };

        function createDefaultDay(num) {
            return {
                id: "day_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7) + "_" + num,
                dayName: num + "日目",
                date: new Date().toISOString().split('T')[0],
                weather: "晴れ",
                hours: "14:00〜22:00",
                workHours: 8.0,
                sales: 0,
                change: 0,
                salesRemark: "",
                diary: "",
                notes: "",
                expenses: { venue: 0, electricity: 0, tent: 0 },
                otherExpenseItems: [],
                staff: [
                    { id: "s1_" + num, name: "スタッフA", present: true, meals: 0, payout: 10000 },
                    { id: "s2_" + num, name: "スタッフB", present: true, meals: 0, payout: 10000 }
                ]
            };
        }

        let state = {
            eventName: "専勝寺2026夏祭り",
            userName: "記録担当者",
            mealCost: 920,
            days: [createDefaultDay(1)],
            currentDayIndex: 0
        };

        // --- Storage (Multi-Event Archive & Legacy Bridge) ---
        function loadData() {
            try {
                const savedArchive = localStorage.getItem(STORAGE_KEY_ARCHIVE);
                if (savedArchive) {
                    const parsed = JSON.parse(savedArchive);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        eventsArchive = parsed;
                    }
                }
            } catch (e) { console.error("Archive load error:", e); }

            const legacySaved = localStorage.getItem(STORAGE_KEY);
            let legacyState = null;
            if (legacySaved) {
                try {
                    const p = JSON.parse(legacySaved);
                    if (p && p.days) legacyState = p;
                } catch (e) { console.error(e); }
            }

            if (eventsArchive.length === 0) {
                if (legacyState) {
                    legacyState.id = legacyState.id || ("evt_" + Date.now());
                    legacyState.updatedAt = legacyState.updatedAt || new Date().toLocaleString('ja-JP');
                    state = legacyState;
                    eventsArchive = [JSON.parse(JSON.stringify(state))];
                } else {
                    state.id = "evt_" + Date.now();
                    state.updatedAt = new Date().toLocaleString('ja-JP');
                    eventsArchive = [JSON.parse(JSON.stringify(state))];
                }
                localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(eventsArchive));
                localStorage.setItem(STORAGE_KEY_ACTIVE_ID, state.id);
            } else {
                const activeId = localStorage.getItem(STORAGE_KEY_ACTIVE_ID);
                let target = eventsArchive.find(ev => ev.id === activeId);
                if (!target && legacyState && !eventsArchive.some(ev => ev.id === legacyState.id)) {
                    target = legacyState;
                    eventsArchive.unshift(target);
                }
                if (!target) target = eventsArchive[0];
                state = target;
                if (!state.id) state.id = "evt_" + Date.now();
            }
            saveData();
        }

        function saveData() {
            if (!state.id) state.id = "evt_" + Date.now();
            const nowStr = new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            state.updatedAt = nowStr;

            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

            const idx = eventsArchive.findIndex(ev => ev.id === state.id);
            if (idx >= 0) {
                eventsArchive[idx] = JSON.parse(JSON.stringify(state));
            } else {
                eventsArchive.unshift(JSON.parse(JSON.stringify(state)));
            }
            localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(eventsArchive));
            localStorage.setItem(STORAGE_KEY_ACTIVE_ID, state.id);
        }

        // --- Utils ---
        const formatCur = (num) => new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(num || 0);

        function calcDayTotals(day) {
            const mCost = getMealCost();
            let sales = day.sales || 0;
            let otherEx = day.otherExpenseItems.reduce((acc, item) => acc + (item.amount || 0), 0);
            let baseEx = (day.expenses.venue || 0) + (day.expenses.electricity || 0) + (day.expenses.tent || 0) + otherEx;
            let staffPay = 0;
            day.staff.forEach(s => {
                if (s.present) staffPay += Math.max(0, (s.payout || 0) - (s.meals * mCost));
            });
            let totalEx = baseEx + staffPay;
            let profit = sales - totalEx;
            return { sales, totalEx, profit, split: Math.floor(profit / 2) };
        }


        // --- Multi-Event Management Actions ---
        window.openHistoryModal = () => { isHistoryModalOpen = true; render(); };
        window.closeHistoryModal = () => { isHistoryModalOpen = false; render(); };

        window.switchEvent = (id) => {
            saveData();
            const target = eventsArchive.find(ev => ev.id === id);
            if (target) {
                state = target;
                localStorage.setItem(STORAGE_KEY_ACTIVE_ID, state.id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                isHistoryModalOpen = false;
                render();
            }
        };

        window.createNewEvent = (inherit) => {
            saveData();
            const defaultName = inherit ? (state.eventName.replace(/[0-9]{4}/, (y) => Number(y) + 1) || "新しいお祭り") : "新しいお祭り";
            const newName = prompt(inherit ? "【前年の設定を引き継いで新しく開始】\n新しいお祭り・イベント名を入力してください：" : "【まっさらな空白から新しく開始】\n新しいお祭り・イベント名を入力してください：", defaultName);
            if (!newName || !newName.trim()) return;

            let newDays = [];
            const todayStr = new Date().toISOString().split('T')[0];

            if (inherit && state.days && state.days.length > 0) {
                const sampleDay = state.days[0];
                const inheritedStaff = (sampleDay.staff || []).map((s, idx) => ({
                    id: "s_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7) + "_" + idx,
                    name: s.name,
                    present: true,
                    meals: 0,
                    payout: s.payout || 10000
                }));
                const inheritedOtherExpenses = (sampleDay.otherExpenseItems || []).map((ex, idx) => ({
                    id: "ex_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7) + "_" + idx,
                    name: ex.name,
                    amount: 0
                }));
                const baseExpenses = {
                    venue: sampleDay.expenses ? (sampleDay.expenses.venue || 0) : 0,
                    electricity: sampleDay.expenses ? (sampleDay.expenses.electricity || 0) : 0,
                    tent: sampleDay.expenses ? (sampleDay.expenses.tent || 0) : 0
                };

                newDays.push({
                    id: "day_" + Date.now() + "_1",
                    dayName: "1日目",
                    date: todayStr,
                    weather: "晴れ",
                    hours: "9:00 - 17:00",
                    sales: 0,
                    change: 0,
                    notes: "",
                    expenses: baseExpenses,
                    otherExpenseItems: inheritedOtherExpenses,
                    staff: inheritedStaff
                });
            } else {
                newDays.push(createDefaultDay(1));
            }

            const newEvent = {
                id: "evt_" + Date.now(),
                eventName: newName.trim(),
                userName: state.userName || "記録担当者",
                mealCost: state.mealCost !== undefined ? state.mealCost : 920,
                days: newDays,
                currentDayIndex: 0,
                updatedAt: new Date().toLocaleString('ja-JP')
            };

            state = newEvent;
            eventsArchive.unshift(JSON.parse(JSON.stringify(state)));
            saveData();
            isHistoryModalOpen = false;
            alert("✅ 新しいお祭り【" + state.eventName + "】を作成しました！");
            render();
        };

        window.renameEventInArchive = (id) => {
            const ev = eventsArchive.find(x => x.id === id);
            if (!ev) return;
            const newName = prompt("お祭り・イベントの新しい名称を入力してください：", ev.eventName);
            if (!newName || !newName.trim()) return;
            ev.eventName = newName.trim();
            if (state.id === id) {
                state.eventName = ev.eventName;
            }
            saveData();
            render();
        };

        window.deleteEventFromArchive = (id) => {
            if (eventsArchive.length <= 1) {
                alert("⚠️ 登録されているお祭りデータが1件のみのため、削除できません。");
                return;
            }
            const ev = eventsArchive.find(x => x.id === id);
            if (!ev) return;
            if (!confirm("⚠️ 本当にお祭り【" + ev.eventName + "】の全データを削除しますか？\n\n※この操作は取り消せません。")) return;

            eventsArchive = eventsArchive.filter(x => x.id !== id);
            if (state.id === id) {
                state = eventsArchive[0];
            }
            saveData();
            render();
            alert("削除が完了しました。");
        };

        window.exportAllEventsJSON = async () => {
            saveData();
            const jsonStr = JSON.stringify(eventsArchive, null, 2);
            const todayStr = new Date().toISOString().split('T')[0];
            const filename = "夏祭り会計_全記録一括バックアップ_" + todayStr + ".json";
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const file = new File([blob], filename, { type: 'application/json' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: filename,
                        text: '全お祭り会計記録のバックアップファイルです。'
                    });
                    return;
                } catch (e) { console.log('Share canceled or failed', e); }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert("📁 全お祭りデータのバックアップファイル（JSON）を保存しました。");
        };

        window.triggerImportJSON = () => {
            document.getElementById('backup-json-input').click();
        };

        window.importAllEventsJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported) && imported.length > 0 && imported[0].days) {
                        if (!confirm("📥 バックアップファイル内に " + imported.length + " 件のお祭りデータが見つかりました。\n\n現在のデータに追加・結合しますか？\n（※同じIDのイベントは最新の内容で上書き更新されます）")) return;
                        
                        imported.forEach(imp => {
                            const idx = eventsArchive.findIndex(x => x.id === imp.id);
                            if (idx >= 0) {
                                eventsArchive[idx] = imp;
                            } else {
                                eventsArchive.push(imp);
                            }
                        });
                        saveData();
                        alert("✅ " + imported.length + " 件のお祭りデータを正常に読み込みました！");
                        render();
                    } else {
                        alert("⚠️ 有効なお祭りバックアップデータではありませんでした。");
                    }
                } catch (err) {
                    alert("⚠️ ファイルの読み込みに失敗しました: " + err.message);
                }
            };
            reader.readAsText(file);
        };

        // --- Actions ---
        window.updateProp = (key, val) => { state[key] = val; saveData(); render(); }
        window.updateDayProp = (key, val) => { state.days[state.currentDayIndex][key] = val; saveData(); render(); }
        window.updateExpense = (key, val) => { state.days[state.currentDayIndex].expenses[key] = Math.max(0, Number(val) || 0); saveData(); render(); }
        window.setSales = (val) => {
            val = Math.max(0, Math.floor(Number(val) || 0));
            state.days[state.currentDayIndex].sales = val || 0; saveData(); render();
        }
        
        function saveDataQuiet() {
            try {
                state.updatedAt = new Date().toLocaleString('ja-JP');
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Auto-save failed", e);
            }
        }

        window.changeSales = (addAmt) => {
            let current = state.days[state.currentDayIndex].sales || 0;
            if (addAmt === 0) {
                if (current > 0 && !confirm("【確認】\n現在入力されている売上金（" + formatCur(current) + "）を0円にリセットしますか？\n\n（誤って押した場合は「キャンセル」を押してください）")) {
                    return;
                }
                current = 0;
            } else {
                current += addAmt;
            }
            state.days[state.currentDayIndex].sales = Math.max(0, current);
            saveData();
            render();
        }
        window.printCurrent = () => { document.body.classList.remove('print-all-mode'); window.print(); };
        window.printAll = () => { document.body.classList.add('print-all-mode'); window.print(); document.body.classList.remove('print-all-mode'); };

        window.addStaff = () => {
            state.days[state.currentDayIndex].staff.push({ id: "s_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7), name: "新規スタッフ", present: true, meals: 0, payout: 10000 });
            saveData(); render();
        }
        window.updateStaff = (id, prop, val) => {
            let s = state.days[state.currentDayIndex].staff.find(x => x.id === id);
            if (s) {
                if (prop === 'payout' || prop === 'meals') val = Math.max(0, Number(val) || 0);
                s[prop] = val;
                saveData(); render();
            }
        }
        window.removeStaff = (id) => {
            if (!confirm("このスタッフを削除しますか？")) return;
            state.days[state.currentDayIndex].staff = state.days[state.currentDayIndex].staff.filter(x => x.id !== id);
            saveData(); render();
        }

        window.addOtherExpense = () => {
            state.days[state.currentDayIndex].otherExpenseItems.push({ id: "ex_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7), name: "", amount: 0 });
            saveData(); render();
        }
        window.updateOtherExpense = (id, prop, val) => {
            let ex = state.days[state.currentDayIndex].otherExpenseItems.find(x => x.id === id);
            if (ex) {
                if (prop === 'amount') val = Math.max(0, Number(val) || 0);
                ex[prop] = val;
                saveData(); render();
            }
        }
        window.removeOtherExpense = (id) => {
            state.days[state.currentDayIndex].otherExpenseItems = state.days[state.currentDayIndex].otherExpenseItems.filter(x => x.id !== id);
            saveData(); render();
        }

        window.addDay = () => {
            if (!confirm("新しい日を追加しますか？")) return;
            state.days.push(createDefaultDay(state.days.length + 1));
            state.currentDayIndex = state.days.length - 1;
            saveData(); render();
        }
        window.deleteCurrentDay = () => {
            if (state.days.length <= 1) { alert("最後の1日は削除できません。"); return; }
            if (!confirm("本当に現在の日程を削除しますか？")) return;
            state.days.splice(state.currentDayIndex, 1);
            state.currentDayIndex = Math.max(0, state.currentDayIndex - 1);
            // Rename days
            state.days.forEach((d, i) => d.dayName = (i + 1) + "日目");
            saveData(); render();
        }

        window.changeUserName = () => {
            let n = prompt("新しい記録者名を入力してください", state.userName);
            if (n) updateProp('userName', n);
        }

        // --- Google Drive & Spreadsheet Actions ---
        window.openSpreadsheet = () => {
            if (gasUrl) {
                // If custom URL is set, try to open spreadsheet
                window.open("https://docs.google.com/spreadsheets", '_blank');
            } else {
                window.open("https://drive.google.com", '_blank');
            }
        };

        window.setGasUrl = () => {
            const isOwner = confirm("🔒 【開発者・管理者専用設定】\n\nこの設定はシステムの作成者・管理者専用です。\n※現場の運営スタッフ・入力担当者様は操作不要です。\n\n管理者用設定画面を開きますか？");
            if (!isOwner) return;

            const current = localStorage.getItem(STORAGE_KEY_GAS_URL) || "";
            const input = prompt("【管理者用】Googleスプレッドシート連携（ウェブアプリ）のURLを入力してください：\n\n※空欄のままOKを押すと連携を解除し、安全な通常共有モードに戻ります。", current);
            if (input !== null) {
                const val = input.trim();
                localStorage.setItem(STORAGE_KEY_GAS_URL, val);
                gasUrl = val;
                alert(val ? "✅ 【管理者】スプレッドシート連携URLを設定しました！" : "連携URLを解除しました（通常共有モードで動作します）。");
                render();
            }
        };

        window.generateCSVBlob = () => {
            const esc = (s) => '"' + String(s || '').replace(/"/g, '""') + '"';
            let csv = "日付,天気・状況,営業時間,稼働時間,売上,釣銭,実質回収額,経費合計,純利益,50/50折半額,売上備考,運営日誌・トラブル記録,スタッフ支給内訳,経費内訳\r\n";
            const mCost = getMealCost();
            state.days.forEach(d => {
                let t = calcDayTotals(d);
                let rec = Math.max(0, (d.sales || 0) - (d.change || 0));
                let staffDtl = d.staff.filter(s => s.present).map(s => `${s.name}(${Math.max(0, s.payout - s.meals * mCost)}円-賄い${s.meals})`).join(" / ");
                let exDtl = `出店${d.expenses.venue} 電気${d.expenses.electricity} テント${d.expenses.tent}`;
                d.otherExpenseItems.forEach(x => { exDtl += ` ${x.name}(${x.amount})` });
                let sRem = d.salesRemark || "";
                let dia = d.diary || d.notes || "";
                csv += `${esc(d.date)},${esc(d.weather)},${esc(d.hours || '14:00〜22:00')},${d.workHours || 8.0},${t.sales},${d.change || 0},${rec},${t.totalEx},${t.profit},${t.split},${esc(sRem)},${esc(dia)},${esc(staffDtl)},${esc(exDtl)}\r\n`;
            });
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
            const filename = `${state.eventName}_会計日報_全日程.csv`;
            return { blob, filename };
        };

        window.downloadCSVDirect = () => {
            const { blob, filename } = window.generateCSVBlob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert("💾 日報データ（CSVファイル）をパソコンにダウンロードしました。\n\nご自身のGoogleドライブに保存するか、Excel等で開くことができます。");
        };

        window.syncToGoogleDrive = async () => {
            if (!navigator.onLine) {
                alert("⚠️ 現在、電波が届かない圏外にいます。\n\n入力データはこの端末の中に安全に保存されていますので絶対に消えません。\nお祭りが終了し、電波がある場所（お帰り道やご自宅など）に戻ってから、もう一度このボタンを押してください。");
                return;
            }

            saveData();

            // パターン1: GAS連携URLが設定されている場合はスプレッドシートへ直接送信
            if (gasUrl && gasUrl.trim() !== "") {
                const btn = document.getElementById('sync-drive-btn');
                const origHtml = btn ? btn.innerHTML : "";
                if (btn) {
                    btn.innerHTML = "⏳ スプレッドシートに送信・保存中...";
                    btn.disabled = true;
                }

                try {
                    const payload = JSON.stringify(state);
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: payload
                    });

                    if (btn) {
                        btn.innerHTML = origHtml;
                        btn.disabled = false;
                    }

                    alert("✅ Googleスプレッドシートへの保存が完了しました！\n\nパソコンやスマホのブラウザから最新の集計表をご確認いただけます。");
                    return;
                } catch (err) {
                    if (btn) {
                        btn.innerHTML = origHtml;
                        btn.disabled = false;
                    }
                    alert("⚠️ スプレッドシートへの送信時にエラーが発生しました: " + err.message + "\n\n通常のファイル保存に切り替えます。");
                }
            }

            // パターン2: GAS未設定の場合（完全ゼロ設定・安全保存）
            // スマホなら共有メニュー（GoogleドライブやLINE）、PCなら直接ダウンロード
            const { blob, filename } = window.generateCSVBlob();
            const file = new File([blob], filename, { type: 'text/csv' });
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: filename,

                      <div class="text-4xl font-black" style="color:#1e3a8a;">📁 お祭り・イベント記録一覧</div>
                      <button class="btn-gray" style="font-size:28px; padding:10px 24px; border-radius:12px;" onclick="closeHistoryModal()">✕ 閉じる</button>
                    </div>

                    <div class="card card-blue mb-6">
                      <div class="text-2xl font-bold mb-2" style="color:#1e40af;">現在 編集中のイベント：</div>
                      <div class="text-4xl font-black" style="color:#0f172a;">【 ${e(state.eventName)} 】</div>
                    </div>

                    <div class="flex flex-col gap-4 mb-8">
                      <button class="btn-success w-full text-left" style="font-size:28px; padding:20px 24px; display:flex; align-items:center; justify-content:space-between;" onclick="createNewEvent(true)">
                        <span>＋ 前年の設定・スタッフを引き継いで新しいお祭りを開始</span>
                        <span style="font-size:22px; background:#14532d; padding:6px 14px; border-radius:8px;">おすすめ</span>
                      </button>
                      <button class="btn-outline w-full text-left" style="font-size:26px; padding:18px 24px;" onclick="createNewEvent(false)">
                        ＋ まっさらな空白から新しいお祭りを開始
                      </button>
                    </div>

                    <div class="text-3xl font-black mb-4" style="color:#334155;">📋 保存済みのお祭りデータ（全 ${eventsArchive.length} 件）</div>
                    
                    <div class="flex flex-col gap-4 mb-8">
                      ${modalCardsHtml}
                    </div>

                    <div class="card card-indigo">
                      <div class="text-2xl font-bold mb-4" style="color:#3730a3;">💾 データのバックアップ・復元（機種変更・データ保全）</div>
                      <div class="flex gap-4 mobile-stack">
                        <button class="btn-gray w-full" style="font-size:24px; padding:16px; background:#475569;" onclick="exportAllEventsJSON()">
                          💾 全お祭りをJSON保存
                        </button>
                        <button class="btn-outline w-full" style="font-size:24px; padding:16px;" onclick="triggerImportJSON()">
                          📥 バックアップから復元
                        </button>
                        <input type="file" id="backup-json-input" style="display:none;" accept=".json" onchange="importAllEventsJSON(event)">
                      </div>
                    </div>

                    <button class="btn-gray w-full mt-6" style="font-size:32px; padding:20px;" onclick="closeHistoryModal()">
                      ✕ 閉じる（編集画面に戻る）
                    </button>
                  </div>
                </div>
                `;
            }

            document.getElementById('app').innerHTML = html;
            if (active) {
                let el = document.getElementById(active);
                if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { } }
            }
        }

        // Init
        window.onload = () => { loadData(); render(); };
    </script>
</body>

</html>
